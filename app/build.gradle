plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.qrscannerapp'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.qrscannerapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Локальный Laravel (проект agr), запущенный `php artisan serve`.
            // 10.0.2.2 — это 127.0.0.1 компьютера, если смотреть из эмулятора.
            // Для настоящего телефона: "http://<IP компьютера>:8000" и `php artisan serve --host=0.0.0.0`
            buildConfigField "String", "SERVER_URL", '"http://10.0.2.2:8000"'
        }
        release {
            buildConfigField "String", "SERVER_URL", '"https://arvestused.agr-torud.ee"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'
}