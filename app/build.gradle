plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.qrscannerapp'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.qrscannerapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Тестовый сервер (задеплоенный agr). Работает и на эмуляторе, и на телефоне.
            // Для локального Laravel: '"http://10.0.2.2:8000"' (эмулятор) или "http://<IP компьютера>:8000"
            buildConfigField "String", "SERVER_URL", '"http://artest.agr-torud.ee"'
        }
        release {
            buildConfigField "String", "SERVER_URL", '"https://arvestused.agr-torud.ee"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-mlkit-vision:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}